<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش یادداشت - Personal Note Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 760px;">
    <!-- هدر صفحه -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold mb-0">✏️ ویرایش یادداشت</h2>
        <a href="/" class="btn btn-outline-secondary btn-sm">بازگشت به لیست</a>
    </div>

    <!-- کارت فرم ویرایش -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form action="/notes/update/{{ note.id }}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold text-secondary">عنوان یادداشت</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        class="form-control form-control-lg" 
                        value="{{ note.title }}" 
                        placeholder="عنوان یادداشت..." 
                        required>
                </div>
                
                <div class="mb-4">
                    <label for="content" class="form-label fw-semibold text-secondary">متن یادداشت</label>
                    <textarea 
                        id="content" 
                        name="content" 
                        class="form-control" 
                        rows="6" 
                        placeholder="متن یادداشت..." 
                        required>{{ note.content }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">ذخیره تغییرات</button>
                    <a href="/" class="btn btn-light border px-3">انصراف</a>
                </div>
            </form>
        submit" class="btn btn-primary px-4">ذخیره تغییرات</button>
                    <a href="/" class="btn btn-light border px-3">انصراف</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
